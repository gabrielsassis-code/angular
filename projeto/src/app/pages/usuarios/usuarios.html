<section class="section">
    h2>adicionar Usuários</h2>

    <form #formUsuario="ngForm" (ngSubmit)="adicionarUsuario()">
        <div #formUsuario="ngForm" class="form-group" ngSubmit="adicionarUsuario()">
            <label for="nome">Nome:</label>
            <input type="text"
             id="nome"
             name="nome"
             [(ngModel)]="nome"
              required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email"
             id="email"
             name="email"
             [(ngModel)]="email"
             class="form-control"
             required>
        </div>
        <button type="submit" class="btn btn-primary">Adicionar</button>
    </form>

    <h3>Lista de Usuários</h3>
    <ul>
        @For(let usuario of usuarios; track $index)
            <li>{{usuario.nome}} - {{usuario.email}}</li>

    </ul>
</section>
